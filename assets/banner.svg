<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Banner do perfil: cofre de moedas douradas com símbolo de código, tema preto, azul-marinho e dourado" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 👉 EDITE: troque "ISAAC" (linha do título) pelo seu nome completo ou apelido -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.6" stop-color="#0B1330"/>
      <stop offset="1" stop-color="#12205A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.5" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB400"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFC21A" stop-opacity="0"/>
    </radialGradient>

    <!-- moeda -->
    <g id="coin">
      <ellipse cx="0" cy="8" rx="34" ry="10" fill="#8A6508"/>
      <rect x="-34" y="-2" width="68" height="10" fill="#B8860B"/>
      <ellipse cx="0" cy="-2" rx="34" ry="10" fill="url(#gold)" stroke="#8A6508" stroke-width="1.5"/>
      <ellipse cx="0" cy="-2" rx="24" ry="6.5" fill="none" stroke="#B8860B" stroke-width="1"/>
    </g>
    <!-- parafuso do cofre -->
    <circle id="bolt" cx="0" cy="-107" r="3.5"/>
    <!-- brilho de 4 pontas -->
    <path id="spark" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- símbolos de código ao fundo -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#FFC21A" opacity="0.10" font-size="46" font-weight="bold">
    <text x="470" y="80">&lt;/&gt;</text>
    <text x="640" y="150">{ }</text>
    <text x="520" y="260">01</text>
    <text x="700" y="285">;</text>
    <text x="30" y="300">( )</text>
  </g>

  <!-- texto principal -->
  <g>
    <text x="60" y="92" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#6C8CFF" letter-spacing="5">DESENVOLVEDOR EM FORMAÇÃO</text>
    <text x="58" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="url(#gold)" letter-spacing="3">ISAAC</text>
    <rect x="62" y="196" width="150" height="4" rx="2" fill="url(#goldH)"/>
    <text x="60" y="238" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#E5E7EB">const futuro = conhecimento * persistência;</text>
    <text x="60" y="268" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#8B93B5">// investir em aprender rende os melhores juros</text>
  </g>

  <!-- pilhas de moedas (esquerda do cofre) -->
  <g>
    <use xlink:href="#coin" href="#coin" x="770" y="300"/>
    <use xlink:href="#coin" href="#coin" x="770" y="288"/>
    <use xlink:href="#coin" href="#coin" x="770" y="276"/>
    <use xlink:href="#coin" href="#coin" x="770" y="264"/>
    <use xlink:href="#coin" href="#coin" x="770" y="252"/>
    <use xlink:href="#coin" href="#coin" x="828" y="300"/>
    <use xlink:href="#coin" href="#coin" x="828" y="288"/>
    <use xlink:href="#coin" href="#coin" x="828" y="276"/>
  </g>

  <!-- cofre -->
  <g transform="translate(985 168)">
    <circle r="124" fill="#070B1E" stroke="url(#gold)" stroke-width="8"/>
    <circle r="102" fill="#0E1A44" stroke="#B8860B" stroke-width="2"/>
    <circle r="78" fill="none" stroke="#FFC21A" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9"/>
    <g fill="#FFC21A">
      <use xlink:href="#bolt" href="#bolt"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(30)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(60)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(90)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(120)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(150)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(180)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(210)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(240)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(270)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(300)"/>
      <use xlink:href="#bolt" href="#bolt" transform="rotate(330)"/>
    </g>
    <!-- volante -->
    <g stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <line x1="-40" y1="-40" x2="40" y2="40"/>
      <line x1="-40" y1="40" x2="40" y2="-40"/>
    </g>
    <g fill="#FFC21A">
      <circle cx="-58" cy="0" r="7"/><circle cx="58" cy="0" r="7"/>
      <circle cx="0" cy="-58" r="7"/><circle cx="0" cy="58" r="7"/>
      <circle cx="-41" cy="-41" r="6"/><circle cx="41" cy="41" r="6"/>
      <circle cx="-41" cy="41" r="6"/><circle cx="41" cy="-41" r="6"/>
    </g>
    <circle r="30" fill="url(#gold)" stroke="#8A6508" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="bold" fill="#070B1E">&lt;/&gt;</text>
  </g>

  <!-- cartola sobre o cofre -->
  <g transform="translate(985 52) rotate(-9)">
    <ellipse cx="0" cy="0" rx="50" ry="9" fill="#05070F" stroke="#FFC21A" stroke-width="1.5"/>
    <rect x="-31" y="-44" width="62" height="44" fill="#05070F" stroke="#FFC21A" stroke-width="1.5"/>
    <ellipse cx="0" cy="-44" rx="31" ry="6" fill="#0B1330" stroke="#FFC21A" stroke-width="1.5"/>
    <rect x="-31" y="-14" width="62" height="10" fill="url(#gold)"/>
  </g>

  <!-- pilhas de moedas (direita do cofre) -->
  <g>
    <use xlink:href="#coin" href="#coin" x="1140" y="300"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="288"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="276"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="264"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="252"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="240"/>
    <use xlink:href="#coin" href="#coin" x="1140" y="228"/>
    <use xlink:href="#coin" href="#coin" x="1090" y="300"/>
    <use xlink:href="#coin" href="#coin" x="1090" y="288"/>
  </g>

  <!-- moedas soltas -->
  <g>
    <g transform="translate(870 90) rotate(-18) scale(0.8)"><use xlink:href="#coin" href="#coin"/></g>
    <g transform="translate(700 205) rotate(14) scale(0.65)"><use xlink:href="#coin" href="#coin"/></g>
  </g>

  <!-- brilhos -->
  <g fill="#FFE27A">
    <use xlink:href="#spark" href="#spark" x="860" y="170" opacity="0.9"/>
    <use xlink:href="#spark" href="#spark" x="1150" y="130" opacity="0.8" transform="translate(1150 130) scale(0.7) translate(-1150 -130)"/>
    <use xlink:href="#spark" href="#spark" x="740" y="60" opacity="0.6" transform="translate(740 60) scale(0.6) translate(-740 -60)"/>
    <use xlink:href="#spark" href="#spark" x="1100" y="40" opacity="0.7" transform="translate(1100 40) scale(0.8) translate(-1100 -40)"/>
  </g>

  <!-- filete dourado inferior -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#goldH)"/>
</svg>
